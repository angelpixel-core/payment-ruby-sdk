name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Ruby ${{ matrix.ruby-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.2", "3.3", "3.4"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run StandardRB linter
        run: bundle exec standardrb

      - name: Run bundler-audit security check
        run: bundle exec bundle-audit check --update

      - name: Run test suite
        run: bundle exec rake test

      - name: Verify YARD documentation coverage
        run: bundle exec rake yard

      - name: Verify gem build
        run: gem build payment-sdk.gemspec

  integration:
    name: Integration Tests (Testcontainers Sandbox)
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby 3.4
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Restore Docker image cache
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: /tmp/docker-sandbox-cache.tar.gz
          key: docker-payment-sandbox-${{ runner.os }}-v1

      - name: Load or pull Docker sandbox image
        run: |
          IMAGE="angelszymczak/payment-sandbox:latest"
          ARCHIVE="/tmp/docker-sandbox-cache.tar.gz"

          if [ -f "$ARCHIVE" ]; then
            echo "Loading Docker image from cache: $ARCHIVE"
            docker load -i "$ARCHIVE"
          else
            echo "Cache miss: Pulling $IMAGE from Docker Hub"
            docker pull "$IMAGE"
            echo "Saving $IMAGE to $ARCHIVE"
            docker save "$IMAGE" | gzip > "$ARCHIVE"
          fi

      - name: Run E2E integration test suite
        run: bundle exec rake test:integration


